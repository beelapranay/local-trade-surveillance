[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-trade-surveillance"
version = "0.1.0"
description = "Local streaming surveillance using real market context and simulated internal activity"
requires-python = ">=3.12"
dependencies = ["websockets>=14,<17"]

[project.scripts]
surveillance = "local_surveillance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
